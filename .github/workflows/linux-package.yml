name: Package Desktop · Linux · x64

# Unofficial Linux build. Unsigned, unpublished, and without an update channel.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to package
        type: string
        default: master
  push:
    tags: ['linux-v*']

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-desktop run package:linux:x64
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-x64-appimage
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Unofficial unsigned Linux x64 AppImage." \
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
